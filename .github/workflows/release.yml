name: Release Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.platform-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform-name: windows-amd64
            target: windows/amd64
            artifact-type: zip
          - os: ubuntu-22.04
            platform-name: linux-amd64
            target: linux/amd64
            artifact-type: tar
          - os: macos-latest
            platform-name: darwin-universal
            target: darwin/universal
            artifact-type: zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application with Wails
        run: wails build -clean -trimpath -platform ${{ matrix.target }} -ldflags "-s -w" -v 2

      - name: Build Auxiliary Tools (rebuild tool)
        run: |
          go build -trimpath -ldflags "-s -w" -o build/bin/rebuild${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/rebuild/main.go

      - name: Package Release Asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
          $zipName = "yt-archiver-$tag-windows-amd64.zip"
          Compress-Archive -Path "build/bin/*" -DestinationPath $zipName
          echo "ASSET_PATH=$zipName" >> $env:GITHUB_ENV

      - name: Package Release Asset (Linux)
        if: runner.os == 'Linux'
        run: |
          TAG="${GITHUB_REF_NAME:-latest}"
          TAR_NAME="yt-archiver-$TAG-linux-amd64.tar.gz"
          tar -czvf "$TAR_NAME" -C build/bin .
          echo "ASSET_PATH=$TAR_NAME" >> $GITHUB_ENV

      - name: Package Release Asset (macOS)
        if: runner.os == 'macOS'
        run: |
          TAG="${GITHUB_REF_NAME:-latest}"
          ZIP_NAME="yt-archiver-$TAG-darwin-universal.zip"
          cd build/bin && zip -r "../../$ZIP_NAME" . && cd ../..
          echo "ASSET_PATH=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform-name }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums (SHA-256)
        run: |
          cd release-assets
          sha256sum yt-archiver* > checksums.txt
          cat checksums.txt

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
